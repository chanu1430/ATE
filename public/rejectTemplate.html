<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rejection Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{
            font-family: Arial, sans-serif;
        }
        .container{
            height: 100vh;

        }
       #template{
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
           
       }
       #template-form{
            border: 1px solid #c3c3c3;
            box-shadow: rgba(99, 99, 99, 0.2) 0px 2px 8px 0px;
            border-radius: 5px;
            padding: 20px;
            background-image: url("/public/bg-1.jpg");
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            min-height: 30vh;
        }
        h3{
            color:white;
            text-align: center;
        }
        #comment{
            height: 10rem;
        }
        #comment:focus {
            outline: none !important;
            box-shadow: none !important;
            border: 1px solid #ccc !important;
        }
        
    </style>
</head>
<body>
    <div class="container" >
        <div class="row" id="template">
            <div class="col-12 col-md-6" id="template-form">
                <p>Mention The Reason For Rejection :</p>
                <form id="commentsForm">
                    <textarea class="form-control comment-box" id="comment" name="comment" placeholder="Write your comment..." required></textarea>
                    <div class="btn-container mt-2">
                        <button type="submit" class="btn btn-secondary submit-btn">Submit</button>
                    </div>
                </form>

            </div>
        </div>
       
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById("commentsForm").addEventListener("submit", async function(event) {
            event.preventDefault();
        
            const formData = new FormData(); 
            const token = "{{ token }}";
            formData.append("comments", document.getElementById("comment").value);
            formData.append("token", token);

            try {
                const response = await fetch("/comments", {
                    method: "POST",
                    body: formData
                });
                
                const res = await response.json(); 
                let outer= document.getElementById("template-form");
                // console.log(res);
                if(res.status=="success"){
                    outer.innerHTML = '<h3 id="response-msg">Thank You For Your Comments!</h3>'; 
                    outer.style.display = "flex";
                    outer.style.justifyContent = "center";  
                    outer.style.alignItems = "center";
                    let responseMsg=document.getElementById("response-msg");
                    responseMsg.style.padding="15px";
                    responseMsg.style.border="3px double white"
                }
                else{
                    document.getElementById("template-form").innerHTML = '<h3 id="response-msg">Error Occurs while submitting the comment.</h3>'; 
               
                }
                  
            } catch (error) {
                document.getElementById("template-form").innerHTML = "<h3 >Error Occurs while submitting the comment.</h3>";

            }
        });
        </script>
</body>
</html>
